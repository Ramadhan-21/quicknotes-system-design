<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>
    <header>
        <h1>QuickNotes</h1>
        <button id="load-btn">Load Notes</button>
    </header>

    <main>
        <p id="status" aria-live="polite"></p>

        <form id="note-form">
            <div>
                <label for="title-input">Title (Required, max 100 chars):</label>
                <input type="text" id="title-input" required maxlength="100">
            </div>
            <div>
                <label for="body-input">Body (Optional):</label>
                <textarea id="body-input" rows="3"></textarea>
            </div>
            <button type="submit" id="submit-btn">Create Note</button>
        </form>

        <ul id="notes-list"></ul>
    </main>
</body>
</html>
